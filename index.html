const translations={"pt":{"nav":["Início","Sobre","Pesquisa","Equipe","Projetos","Publicações","Contato"],"hero":"Nutrição de plantas para atenuação de estresses abióticos","sub":"Investigação científica na interface solo–planta–ambiente para compreender mecanismos de tolerância e desenvolver estratégias sustentáveis de manejo.","eyebrow":"GRUPO DE PESQUISA · ESALQ/USP","explore":"Conheça nossas pesquisas","about":"Sobre o grupo","impactTitle":"Inserção científica nacional e internacional","impactText":"Embora oficialmente constituído em 2026, o grupo está fundamentado na trajetória científica de seu coordenador e nas colaborações estabelecidas com instituições brasileiras e estrangeiras. Essa inserção é evidenciada pela produção acadêmica do coordenador, com mais de 70 artigos científicos, 10 capítulos de livros e mais de 250 resumos em eventos, além da participação em mais de 60 eventos técnico-científicos no Brasil e no exterior. Suas atividades abrangem a formação de recursos humanos, projetos de pesquisa e participação editorial em periódicos científicos. A linha de pesquisa é reconhecida institucionalmente pelo Programa de Pós-Graduação em Solos e Nutrição de Plantas da ESALQ/USP e aborda desafios relacionados a metais potencialmente tóxicos, déficit hídrico, calor, excesso de luz e salinidade, visando à produtividade, à sustentabilidade e à segurança alimentar.","research":"Linhas de pesquisa","people":"Equipe e orientações","projects":"Projetos em andamento","publications":"Produção científica","contact":"Contato","mainline":"Linha oficial do PPG","official":"Nutrição de plantas para atenuação de estresses abióticos","topics":"Eixos temáticos do grupo","coord":"Coordenação","students":"Orientações em andamento (registros públicos)","source":"Consultar fonte","view":"Ver registro","type":["Artigos","Capítulos","Resumos"],"pubinfo":"Seleção de trabalhos identificados em registros públicos. O catálogo integral de artigos e capítulos deve ser conferido no Lattes.","caution":"Dados acadêmicos compilados de fontes públicas; a composição formal do grupo no DGP/CNPq ainda precisa de validação.","contactdesc":"Departamento de Ciência do Solo · Escola Superior de Agricultura “Luiz de Queiroz” · Universidade de São Paulo · Av. Pádua Dias, 11 · CEP 13418-900 · Piracicaba, SP, Brasil.","projectsnote":"Projetos listados como em andamento no registro público do currículo, consultado em novembro de 2026.","all":"Ver currículo e produção completa","bio":"Engenheiro Agrônomo pela Universidade José do Rosário Vellano - UNIFENAS, em 2012. Mestre em Ciências (Área de concentração: Solos e Nutrição de Plantas) pela Escola Superior de Agricultura ''Luiz de Queiroz'' da Universidade de São Paulo - ESALQ/USP, em 2014. Doutor em Ciências (Área de concentração: Biologia na Agricultura e no Ambiente) pelo Centro de Energia Nuclear na Agricultura da Universidade de São Paulo - CENA/USP, em 2018, com período no Programa de Pós-Graduação em Ciências (Environmental Sciences) da Hasselt University - UHasselt (2016-2017). O coordenador realizou Pós-Doutorado junto ao Departamento de Ciência do Solo da ESALQ/USP (2018-2022), com período no Centro de Ciências Ambientais (CMK) da UHasselt (2018-2019). Posteriormente, realizou pós-doutorado de curta duração no CMK da UHasselt (12/2024-02-2025). Foi Professor Adjunto A, nível 1, da Universidade Federal de Lavras - UFLA, onde atuou na área de Nutrição Mineral de Plantas (2022-2024) e coorientou alunos de mestrado e doutorado pelo Programa de Pós-Graduação em Ciência do Solo (Conceito 7 da CAPES) da UFLA (2022-2026). Desde 08/2024 é Professor Doutor - Nível 1, Ref. MS-3, da ESALQ-USP, onde atua na área de Nutrição Mineral de Plantas e orienta alunos de mestrado pelo Programa de Pós-Graduação em Solos e Nutrição de Plantas (Conceito 7 da CAPES) da ESALQ/USP. Também atua como Professor, e desde 04/2026, como vice-coordenador dos cursos em Fisiologia Vegetal e Desenvolvimento de Plantas e Solos e Nutrição de Plantas, promovidos pelo Programa de Educação Continuada em Agricultura Sustentável (SolloAgro) da ESALQ/USP. É integrante do Instituto Nacional de Ciência e Tecnologia (INCT) em Biodiversidade de Solo e do INCT em Segurança de Solo e Alimento. Consultor científico de agências de fomento e revistas científicas indexadas no Brasil e no exterior. É editor associado (área: Solos e Nutrição de Plantas) do periódico Scientia Agricola e editor convidado dos periódicos Soil Systems (Soil Fertility Evaluation and Precision Fertilization) e Frontiers in Plant Science (Mineral Nutrition and Plant Hydraulics in Agricultural Crops Under Drought Stress). Atuou como editor convidado dos periódicos Agriculture (Agronomic Biofortification of Crops: Recent Advances and Future Perspectives; Fertilization Strategies for Improving Fertilizer Use Efficiency; Strategies to Enhance Nutrient Use Efficiency and Crop Nutrition), Plants (Plant Nutrition in Alleviating Abiotic Stress) e Soil Systems (Advances in Fertilizer Technologies and Use to Improve Nutrient Efficiency and Minimize Environmental Impacts). Publicou >70 artigos científicos, 10 capítulos de livros, >250 resumos em eventos científicos e participou de >60 eventos técnico-científicos, no Brasil (BA, MG, PE, PR, SC e SP) e no exterior (Argentina, Bélgica, Chile, China, Escócia, EUA, Hungria, Inglaterra, Peru, Portugal e Suíça). Tem experiência em nutrição de plantas para mitigação de estresses abióticos e fitorremediação de elementos potencialmente tóxicos. É coordenador do Grupo de Pesquisa em Nutrição de plantas para mitigação estresses abióticos e vice-coordenador do Grupo de Estudos em Fertilidade e Adubação (GEFA).","researchdesc":"As pesquisas conduzidas pelo Grupo de Pesquisa em Nutrição de Plantas para Atenuação de Estresses Abióticos da ESALQ/USP estão orientadas conforme os eixos abaixo.","intro":"Pesquisa, formação e colaboração científica","introdesc":"Do metabolismo vegetal à recuperação de solos contaminados, o grupo integra nutrição mineral, fisiologia vegetal e soluções biológicas.","category":"Categoria","year":"Ano","historyTitle":"Nossa história","historyText":"O Grupo de Pesquisa em Nutrição de Plantas para Atenuação de Estresses Abióticos foi oficialmente criado em 2026, com registro junto ao Conselho Nacional de Desenvolvimento Científico e Tecnológico (CNPq), para atender a uma demanda técnico-científica na área de nutrição vegetal voltada à mitigação dos estresses ambientais. Vinculado à Escola Superior de Agricultura “Luiz de Queiroz” da Universidade de São Paulo (ESALQ/USP), o grupo busca compreender os mecanismos nutricionais, fisiológicos e bioquímicos envolvidos nas respostas das plantas a condições adversas, além de desenvolver estratégias para promover produtividade e sustentabilidade agrícola.","founderTitle":"Fundação e coordenação","founderIntro":"O grupo foi criado pelo Prof. Dr. Flávio Henrique Silveira Rabêlo."},"en":{"nav":["Home","About","Research","People","Projects","Publications","Contact"],"hero":"Plant nutrition for abiotic stress mitigation","sub":"Research at the soil–plant–environment interface to understand stress tolerance mechanisms and develop sustainable management strategies.","eyebrow":"RESEARCH GROUP · ESALQ/USP","explore":"Explore our research","about":"About the group","impactTitle":"National and international scientific engagement","impactText":"Although formally established in 2026, the group builds on its leader’s scientific trajectory and collaborations with Brazilian and international institutions. This engagement is reflected in more than 70 scientific articles, 10 book chapters and over 250 conference abstracts by its leader, as well as participation in more than 60 scientific and technical events in Brazil and abroad. Activities include student training, research projects and editorial contributions to scientific journals. The research line is institutionally recognized by the ESALQ/USP Graduate Program in Soil and Plant Nutrition and addresses challenges involving potentially toxic elements, water deficit, heat, excess light and salinity, contributing to productivity, sustainability and food security.","research":"Research areas","people":"People and supervision","projects":"Ongoing projects","publications":"Scientific output","contact":"Contact","mainline":"Official graduate research line","official":"Plant nutrition for abiotic stress mitigation","topics":"Research themes","coord":"Group leader","students":"Current supervision (public records)","source":"Source","view":"View record","type":["Journal articles","Book chapters","Conference abstracts"],"pubinfo":"Selected works identified in public records. The full journal article and chapter catalog should be verified against the Lattes CV.","caution":"Academic data compiled from public sources; formal DGP/CNPq group membership still requires verification.","contactdesc":"Department of Soil Science · Luiz de Queiroz College of Agriculture · University of São Paulo · Av. Pádua Dias, 11 · Postal code 13418-900 · Piracicaba, São Paulo, Brazil.","projectsnote":"Projects marked as ongoing in the public CV record, consulted in November 2026.","all":"View complete academic profile","bio":"He earned his Agronomy degree from Universidade José do Rosário Vellano (UNIFENAS) in 2012, an MSc in Sciences (Soils and Plant Nutrition) from ESALQ/USP in 2014, and a PhD in Sciences (Biology in Agriculture and the Environment) from CENA/USP in 2018, including a research period in Environmental Sciences at Hasselt University (2016–2017). He completed postdoctoral research at the Department of Soil Science, ESALQ/USP (2018–2022), including a period at Hasselt University's Centre for Environmental Sciences (CMK, 2018–2019), followed by a short postdoctoral appointment at CMK (December 2024–February 2025). He was an Assistant Professor at the Federal University of Lavras (UFLA, 2022–2024), working in Plant Mineral Nutrition, and co-supervised MSc and PhD students in its CAPES grade-7 Soil Science graduate program (2022–2026). Since August 2024, he has served as Professor Doutor, level 1, MS-3, at ESALQ/USP, working in Plant Mineral Nutrition and supervising MSc students in its CAPES grade-7 Soil and Plant Nutrition graduate program. He also teaches and, since April 2026, has served as vice-coordinator of the SolloAgro continuing education courses in Plant Physiology and Development and Soil and Plant Nutrition at ESALQ/USP. He is a member of the National Institutes of Science and Technology (INCTs) in Soil Biodiversity and in Soil and Food Security. He serves as a scientific consultant for funding agencies and indexed journals in Brazil and abroad. He is associate editor (Soils and Plant Nutrition) of Scientia Agricola and guest editor for Soil Systems (Soil Fertility Evaluation and Precision Fertilization) and Frontiers in Plant Science (Mineral Nutrition and Plant Hydraulics in Agricultural Crops Under Drought Stress). He previously served as guest editor for Agriculture (Agronomic Biofortification of Crops: Recent Advances and Future Perspectives; Fertilization Strategies for Improving Fertilizer Use Efficiency; Strategies to Enhance Nutrient Use Efficiency and Crop Nutrition), Plants (Plant Nutrition in Alleviating Abiotic Stress), and Soil Systems (Advances in Fertilizer Technologies and Use to Improve Nutrient Efficiency and Minimize Environmental Impacts). He has published more than 70 scientific articles, 10 book chapters, and more than 250 conference abstracts, and participated in more than 60 scientific and technical events in Brazil (BA, MG, PE, PR, SC, and SP) and abroad (Argentina, Belgium, Chile, China, Scotland, USA, Hungary, England, Peru, Portugal, and Switzerland). His expertise includes plant nutrition for abiotic stress mitigation and phytoremediation of potentially toxic elements. He coordinates the Plant Nutrition for Abiotic Stress Mitigation Research Group and is vice-coordinator of the Fertility and Fertilization Study Group (GEFA).","researchdesc":"Research conducted by the ESALQ/USP Plant Nutrition for Abiotic Stress Mitigation Research Group is organized according to the thematic areas below.","intro":"Research, education and scientific collaboration","introdesc":"From plant metabolism to remediation of contaminated soils, the group integrates mineral nutrition, plant physiology and biological solutions.","category":"Category","year":"Year","historyTitle":"Our history","historyText":"The Plant Nutrition for Abiotic Stress Mitigation Research Group was officially established in 2026 and registered with the Brazilian National Council for Scientific and Technological Development (CNPq) to address a scientific and technical need for plant nutrition approaches to alleviate environmental stresses. Based at the Luiz de Queiroz College of Agriculture, University of São Paulo (ESALQ/USP), the group investigates nutritional, physiological and biochemical mechanisms underlying plant responses to adverse conditions and develops strategies to support agricultural productivity and sustainability.","founderTitle":"Foundation and leadership","founderIntro":"The group was founded by Prof. Dr. Flávio Henrique Silveira Rabêlo."},"fr":{"nav":["Accueil","À propos","Recherche","Équipe","Projets","Publications","Contact"],"hero":"Nutrition des plantes pour atténuer les stress abiotiques","sub":"Recherche à l’interface sol–plante–environnement pour comprendre les mécanismes de tolérance et développer des stratégies de gestion durables.","eyebrow":"GROUPE DE RECHERCHE · ESALQ/USP","explore":"Découvrir nos recherches","about":"À propos du groupe","impactTitle":"Rayonnement scientifique national et international","research":"Axes de recherche","people":"Équipe et encadrement","projects":"Projets de recherche","publications":"Publications scientifiques","contact":"Contact","mainline":"Axe officiel du programme de troisième cycle","official":"Nutrition des plantes pour atténuer les stress abiotiques","topics":"Thématiques du groupe","coord":"Coordination","students":"Encadrements en cours","source":"Consulter la source","view":"Voir la fiche","type":["Articles","Chapitres","Communications"],"pubinfo":"Publications extraites du CV Lattes du coordinateur. Les notices et leurs liens sont conservés dans leur langue d’origine.","caution":"La composition officielle de l’équipe dans le DGP/CNPq reste à vérifier.","contactdesc":"Département des sciences du sol · École supérieure d’agriculture « Luiz de Queiroz » · Université de São Paulo · Av. Pádua Dias, 11 · Code postal 13418-900 · Piracicaba, São Paulo, Brésil.","projectsnote":"Projets importés du CV Lattes du coordinateur, selon le fichier XML fourni.","all":"Consulter le CV complet","researchdesc":"Les recherches menées par le Groupe de recherche en nutrition des plantes pour atténuer les stress abiotiques de l’ESALQ/USP s’articulent autour des axes suivants.","intro":"Recherche, formation et collaboration scientifique","introdesc":"Du métabolisme végétal à la restauration des sols contaminés, le groupe associe nutrition minérale, physiologie végétale et solutions biologiques.","category":"Catégorie","year":"Année","historyTitle":"Notre histoire","founderTitle":"Fondation et coordination","founderIntro":"Le groupe a été fondé par le professeur Flávio Henrique Silveira Rabêlo.","historyText":"Le groupe de recherche en nutrition des plantes pour atténuer les stress abiotiques a été officiellement créé en 2026 et enregistré auprès du CNPq afin de répondre à une demande technico-scientifique croissante. Rattaché à l’ESALQ/USP, il étudie les mécanismes nutritionnels, physiologiques et biochimiques des réponses des plantes au déficit hydrique, à la chaleur, à l’excès de lumière, à la salinité et aux éléments potentiellement toxiques, ainsi que les applications des biointrants, de la phytoremédiation et de l’économie circulaire.","impactText":"Bien que créé officiellement en 2026, le groupe s’appuie sur le parcours scientifique de son coordinateur et sur des collaborations au Brésil et à l’étranger. Celui-ci compte plus de 70 articles scientifiques, 10 chapitres d’ouvrages, plus de 250 résumés présentés lors de manifestations scientifiques et une participation à plus de 60 événements scientifiques et techniques. Le groupe contribue à la formation, aux projets de recherche et aux activités éditoriales. Son axe de recherche est reconnu par le programme de troisième cycle en sols et nutrition végétale de l’ESALQ/USP et vise une agriculture productive, durable et favorable à la sécurité alimentaire.","bio":"Ingénieur agronome diplômé de l’UNIFENAS (2012), titulaire d’un master en sciences (sols et nutrition végétale) de l’ESALQ/USP (2014) et d’un doctorat en sciences du CENA/USP (2018), avec un séjour de recherche à l’Université de Hasselt (2016–2017). Il a effectué un postdoctorat à l’ESALQ/USP (2018–2022), comprenant un séjour au CMK de l’Université de Hasselt (2018–2019), puis un séjour postdoctoral de courte durée dans ce centre (décembre 2024–février 2025). Professeur adjoint à l’UFLA de 2022 à 2024, il est professeur à l’ESALQ/USP depuis août 2024, dans le domaine de la nutrition minérale des plantes. Il encadre des étudiants de troisième cycle et participe à la formation continue SolloAgro, dont il est vice-coordinateur de deux formations depuis avril 2026. Il participe à deux instituts nationaux de science et technologie (INCT), exerce des activités d’expertise scientifique et d’édition, notamment comme éditeur associé de Scientia Agricola. Il a publié plus de 70 articles, 10 chapitres de livres et plus de 250 résumés de conférences, et participé à plus de 60 événements au Brésil et à l’étranger. Ses domaines de recherche comprennent la nutrition végétale, l’atténuation des stress abiotiques et la phytoremédiation des éléments potentiellement toxiques. Il coordonne ce groupe de recherche et est vice-coordinateur du GEFA."},"es":{"nav":["Inicio","Acerca del grupo","Investigación","Equipo","Proyectos","Publicaciones","Contacto"],"hero":"Nutrición vegetal para mitigar los estreses abióticos","sub":"Investigación en la interfaz suelo–planta–ambiente para comprender los mecanismos de tolerancia y desarrollar estrategias sostenibles de manejo.","eyebrow":"GRUPO DE INVESTIGACIÓN · ESALQ/USP","explore":"Conozca nuestras investigaciones","about":"Acerca del grupo","impactTitle":"Proyección científica nacional e internacional","research":"Líneas de investigación","people":"Equipo y dirección académica","projects":"Proyectos de investigación","publications":"Producción científica","contact":"Contacto","mainline":"Línea oficial del posgrado","official":"Nutrición vegetal para mitigar los estreses abióticos","topics":"Ejes temáticos del grupo","coord":"Coordinación","students":"Direcciones académicas en curso","source":"Consultar fuente","view":"Ver registro","type":["Artículos","Capítulos","Trabajos en congresos"],"pubinfo":"Publicaciones importadas del CV Lattes del coordinador. Los registros y enlaces conservan su idioma original.","caution":"La composición oficial del equipo en el DGP/CNPq aún requiere verificación.","contactdesc":"Departamento de Ciencia del Suelo · Escuela Superior de Agricultura «Luiz de Queiroz» · Universidad de São Paulo · Av. Pádua Dias, 11 · Código postal 13418-900 · Piracicaba, São Paulo, Brasil.","projectsnote":"Proyectos importados del CV Lattes del coordinador, según el archivo XML proporcionado.","all":"Consultar currículo completo","researchdesc":"Las investigaciones del Grupo de Investigación en Nutrición Vegetal para la Mitigación de Estreses Abióticos de ESALQ/USP se organizan según los siguientes ejes.","intro":"Investigación, formación y colaboración científica","introdesc":"Desde el metabolismo vegetal hasta la recuperación de suelos contaminados, el grupo integra nutrición mineral, fisiología vegetal y soluciones biológicas.","category":"Categoría","year":"Año","historyTitle":"Nuestra historia","founderTitle":"Fundación y coordinación","founderIntro":"El grupo fue fundado por el Prof. Dr. Flávio Henrique Silveira Rabêlo.","historyText":"El Grupo de Investigación en Nutrición Vegetal para la Mitigación de Estreses Abióticos fue creado oficialmente en 2026 y registrado ante el CNPq para responder a una creciente demanda técnico-científica. Vinculado a ESALQ/USP, estudia los mecanismos nutricionales, fisiológicos y bioquímicos de la respuesta vegetal al déficit hídrico, las altas temperaturas, el exceso de luz, la salinidad y los elementos potencialmente tóxicos, así como el uso de bioinsumos, la fitorremediación y la economía circular.","impactText":"Aunque se constituyó oficialmente en 2026, el grupo se apoya en la trayectoria científica de su coordinador y en colaboraciones con instituciones brasileñas y extranjeras. Su producción incluye más de 70 artículos científicos, 10 capítulos de libros, más de 250 resúmenes en eventos científicos y la participación en más de 60 eventos técnico-científicos. El grupo contribuye a la formación de recursos humanos, los proyectos de investigación y las actividades editoriales. Su línea de investigación está reconocida por el programa de posgrado en Suelos y Nutrición Vegetal de ESALQ/USP y busca mejorar la productividad, la sostenibilidad y la seguridad alimentaria.","bio":"Ingeniero agrónomo por UNIFENAS (2012), máster en Ciencias (Suelos y Nutrición Vegetal) por ESALQ/USP (2014) y doctor en Ciencias por CENA/USP (2018), con una estancia de investigación en la Universidad de Hasselt (2016–2017). Realizó un posdoctorado en ESALQ/USP (2018–2022), incluida una estancia en el CMK de la Universidad de Hasselt (2018–2019), y otro de corta duración en ese centro (diciembre de 2024–febrero de 2025). Fue profesor adjunto en UFLA entre 2022 y 2024 y es profesor de ESALQ/USP desde agosto de 2024 en el área de Nutrición Mineral de Plantas. Dirige estudiantes de posgrado y participa en la formación continua SolloAgro, donde es vice
